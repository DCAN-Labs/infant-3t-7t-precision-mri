<script>
    // Configuration
    const bucketName = 'infant_3T_7T_precision_imaging_datalad';
    const bucketRegion = 'us-east-2';
    const endpoint = `https://${bucketName}.s3.amazonaws.com/`;

    // Only include these files
    const allowedFiles = [
        "dataPB015.zip",
        "dataPB016.zip",
        "dataPB017.zip",
        "dataPB020.zip",
        "dataPB021.zip",
        "dataPB022.zip"
    ];

    function renderFileList() {
        const container = document.getElementById('bucket-contents');
        const ul = document.createElement('ul');

        allowedFiles.forEach(file => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `${endpoint}${file}`;
            a.textContent = file;
            a.download = file;
            li.appendChild(a);
            ul.appendChild(li);
        });

        container.appendChild(ul);
    }

    window.onload = renderFileList;
</script>
